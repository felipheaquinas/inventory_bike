<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Bike</title>
    <link rel="shortcut icon" href="https://icons.iconarchive.com/icons/elegantthemes/beautiful-flat-one-color/128/bike-icon.png" type="image/x-icon">
    <link rel="stylesheet" href="./estilo/estilo.css">
</head>

<body>
    <header>
        <nav>
            <ul type="none">
                <li>
                    <a href="#" id="demais_paginas"><img
                            src="https://icons.iconarchive.com/icons/arturo-wibawa/akar/128/home-icon.png">Painel</a>
                </li>
                <li>
                    <a href="#" id="atual"><img
                            src="https://icons.iconarchive.com/icons/ionic/ionicons/128/bag-outline-icon.png">Produtos</a>
                </li>
            </ul>
        </nav>
    </header>
    <main>
        <div id="cadastro" class="container">
            <h2><span>🛒</span>Adicionar produto</h2>

            <form action="" method="get" autocomplete="on">
                <p><input type="text" required placeholder="Nome do Produto" id="nome_do_produto"></p>
                <p><input type="number" required placeholder="Cod. Barra" min="1" step="1"></p>
                <p><input type="number" required placeholder="Quantidade" min="1" step="1"></p>
                <p>
                    <select required>
                        <option disabled selected>Categoria</option>
                        <option value="PN">Aro</option>
                        <option value="PN">Pneu</option>
                        <option value="PN">Cubo</option>
                        <option value="PN">Caixa de direção</option>
                        <option value="PN">Canote</option>
                        <option value="PN">Camara</option>
                        <option value="PN">Catraca/K7</option>
                        <option value="PN">Coroa</option>
                        <Option value="PN">Corrente</Option>
                        <option value="PN">Freio</option>
                        <option value="PN">Guidão</option>
                        <option value="PN">Macha</option>
                        <option value="PN">Manopla</option>
                        <option value="PN">Mesinha</option>
                        <option value="PN">Movimento central</option>
                        <option value="PN">Pedal</option>
                        <option value="PN">Pé de vela</option>
                        <option value="PN">Quadro</option>
                        <option value="PN">Raio</option>
                        <option value="PN">Selim</option>
                        <option value="PN">Suspensão</option>
                    </select>
                </p>
                <p><input type="number" required placeholder="Valor Unitário" step="0.01"></p>
                <p>
                    <input type="submit" value="💾 Salvar" class="botoes" id="salvar">
                    <input type="reset" value="🔄 Resetar" class="botoes">
                
                </p>
            </form>
        </div>

        <div id="lista" class="container">
            <h2><span>📦</span>Lista de Inventário</h2>

            <p><input type="text" placeholder="🔍 Pesquise o nome ou categoria"></p>

            <div>
                <table>
                    <thead>
                        <tr>
                            <th scope="col">Nome</th>
                            <th scope="col">Cod. Barra</th>
                            <th scope="col">Quantidade</th>
                            <th scope="col">Categoria</th>
                            <th scope="col">Valor</th>
                            <th scope="col">Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>1</td>
                            <td>1</td>
                            <td>1</td>
                            <td>1</td>
                            <td>1</td>
                            <td>1</td>
                        </tr>
                    </tbody>
                    <tfoot>
                        <p id="res"></p>
                    </tfoot>
                </table>
            </div>
        </div>
    </main>

    <footer>
        <p>Desenvolvido por<a href="https://github.com/felipheaquinas" target="_blank" rel="noopener noreferrer"><img src="https://icons.iconarchive.com/icons/github/octicons/128/mark-github-16-icon.png">Felipheaquinas</a></p>
    </footer>

    <script src="./script/script.js"></script>
</body>

</html>
